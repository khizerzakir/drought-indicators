name: Publish Quarto book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies once
        run: python -m pip install -r requirements.txt

      - name: Test indicator code against reference packages
        run: python -m pytest -q tests

      - name: Cache Quarto computations
        uses: actions/cache@v4
        with:
          path: |
            _freeze
            .quarto
          key: ${{ runner.os }}-quarto-${{ hashFiles('**/*.qmd', '**/*.ipynb', 'theme/*.scss', 'requirements.txt') }}

      - name: Render book
        uses: quarto-dev/quarto-actions/render@v2

      - name: Render slide presentation
        run: |
          quarto render presentation.qmd --no-execute
          cp presentation.html docs/presentation.html
          if [ -d presentation_files ]; then cp -R presentation_files docs/; fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
