project:
  type: book
  output-dir: docs
  resources:
    - "notebooks/*.ipynb"

book:
  title: "Drought indicators from remote sensing"
  subtitle: "A practical Quarto tutorial"
  author: "CLIMB course materials"
  date: today
  repo-url: https://github.com/khizerzakir/drought-indicators
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - tutorial.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-fold: show
    code-tools: true
    number-sections: true

execute:
  freeze: auto
  warning: false
  message: false
